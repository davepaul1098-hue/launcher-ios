name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Installer les dépendances
        run: npm install

      - name: Embarquer l'IA de détourage (hors-ligne)
        run: |
          mkdir -p www/vendor/wasm
          cp node_modules/@mediapipe/tasks-vision/vision_bundle.mjs www/vendor/vision_bundle.js
          cp node_modules/@mediapipe/tasks-vision/wasm/* www/vendor/wasm/
          curl -fL --retry 3 -o www/vendor/magic_touch.tflite https://storage.googleapis.com/mediapipe-models/interactive_segmenter/magic_touch/float32/1/magic_touch.tflite
          test "$(stat -c%s www/vendor/magic_touch.tflite)" -gt 1000000
          curl -fL --retry 3 -o www/vendor/selfie_segmenter.tflite https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_segmenter/float16/latest/selfie_segmenter.tflite || echo "selfie_segmenter indisponible (optionnel)"
          ls -lh www/vendor www/vendor/wasm

      - name: Créer le projet Android
        run: npx cap add android

      - name: Patch Android (launcher, plugin natif, permissions)
        run: python3 scripts/patch_android.py

      - name: Synchroniser le web
        run: npx cap sync android

      - name: Compiler l'APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Préparer l'APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Launcher-iOS.apk

      - name: Publier dans les Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Launcher iOS (build ${{ github.run_number }})
          body: "APK debug du launcher iOS. Installe-le puis choisis-le comme launcher par défaut."
          files: Launcher-iOS.apk
          make_latest: true
