name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Installer les dépendances
        run: npm install

      - name: Créer le projet Android
        run: npx cap add android

      - name: Patch Android (launcher, plugin natif, permissions)
        run: python3 scripts/patch_android.py

      - name: Synchroniser le web
        run: npx cap sync android

      - name: Compiler l'APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Préparer l'APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Launcher-iOS.apk

      - name: Publier dans les Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Launcher iOS (build ${{ github.run_number }})
          body: "APK debug du launcher iOS. Installe-le puis choisis-le comme launcher par défaut."
          files: Launcher-iOS.apk
          make_latest: true
